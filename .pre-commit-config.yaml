repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --workspace --exclude iad-grpc --exclude iad-wasm -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cargo test --workspace --exclude iad-grpc --exclude iad-wasm --quiet'
        language: system
        types: [rust]
        pass_filenames: false

      - id: node-test
        name: node sdk test
        entry: node --test sdk/node/src/protocol.test.js
        language: system
        types: [javascript]
        pass_filenames: false
