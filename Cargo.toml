[workspace]
resolver = "2"
members = [
    "crates/iad",
    "crates/iad-core",
    "crates/iad-storage",
    "crates/iad-api",
    "crates/iad-sdk",
    "crates/iad-grpc",
    "crates/iad-wasm",
    "crates/iad-storage-pg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/rizoadev/ikamai-agent-daemon"
authors = ["Rizoa <rizoa@ikamai.id>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"
libc = "0.2"
tower-http = { version = "0.5", features = ["trace", "cors"] }

